name: exercises
on: [push, pull_request]

jobs:
  exercises:
    strategy:
      fail-fast: false
      matrix:
        include:
          - nim: '2.2.4'
            os: linux

          - nim: '2.2.4'
            os: macOS

          - nim: '2.2.4'
            os: windows

          - nim: devel
            os: linux

    name: nim-${{ matrix.nim }}-${{ matrix.os }}
    # The devel compiler can break at any time, so its leg doesn't count towards the Tests check
    continue-on-error: ${{ matrix.nim == 'devel' }}
    runs-on: ${{ matrix.os == 'linux' && 'ubuntu-24.04' || (matrix.os == 'macOS' && 'macos-26' || 'windows-2022') }}

    steps:
      - name: Checkout exercism/nim
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Nim
        uses: jiro4989/setup-nim-action@08957181dc5baf5f8446497598f798020a03e66a # v2.5.1
        with:
          nim-version: "${{ matrix.nim }}"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: nimble build -Y

      - name: Show versions of Nim and Nimble
        run: |
          nim --version
          printf '\n\n\n\n'
          nimble --version

      - name: Compile `check_exercises.nim`
        run: nim c --styleCheck:error _test/check_exercises.nim

      - name: Run `check_exercises`
        run: _test/check_exercises

      - name: Compile `check_stubs.nim`
        run: nim c --styleCheck:error _test/check_stubs.nim

      - name: Run `check_stubs`
        run: _test/check_stubs

  tests:
    name: Tests
    needs: exercises
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check that every configuration passed
        env:
          RESULT: ${{ needs.exercises.result }}
        run: |
          if [[ "$RESULT" != "success" ]]; then
            echo "The exercise tests failed on at least one configuration."
            exit 1
          fi
