name: exercises
on: [push, pull_request]

jobs:
  exercises:
    strategy:
      fail-fast: false
      matrix:
        include:
          - nim: '2.2.4'
            os: linux

          - nim: '2.2.4'
            os: macOS

          - nim: '2.2.4'
            os: windows

          - nim: devel
            os: linux

          - nim: '1.6.x'
            os: linux

    name: nim-${{ matrix.nim }}-${{ matrix.os }}
    runs-on: ${{ matrix.os == 'linux' && 'ubuntu-26.04' || (matrix.os == 'macOS' && 'macos-26' || 'windows-2022') }}

    steps:
      - name: Checkout exercism/nim
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install Nim
        uses: jiro4989/setup-nim-action@cb1fc1270b117457dd0d9f610ec981fad3369cec # v2.3.0
        with:
          nim-version: "${{ matrix.nim }}"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: nimble build -Y

      - name: Show versions of Nim and Nimble
        run: |
          nim --version
          printf '\n\n\n\n'
          nimble --version

      - name: Compile `check_exercises.nim`
        run: nim c --styleCheck:error _test/check_exercises.nim

      - name: Run `check_exercises`
        run: _test/check_exercises

      - name: Compile `check_stubs.nim`
        run: nim c --styleCheck:error _test/check_stubs.nim

      - name: Run `check_stubs`
        run: _test/check_stubs
